name: Check and deploy CaveRace website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/check_website.py'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/check_website.py'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check static website
        run: python3 scripts/check_website.py website

      - name: Save verified website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caverace-site
          path: website/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Finish an active upload before another deployment starts.
    concurrency:
      group: caverace-production
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: '9be79373-29bb-4b8a-a999-495ad397f5ae'
      AZURE_SUBSCRIPTION_ID: 'e42fceff-ea17-403e-96cd-3337df3043b1'
      AZURE_FRONT_DOOR_DOMAINS: 'caverace.com'
      AZURE_STORAGE_ACCOUNT: 'caverace'
      AZURE_FRONT_DOOR_RESOURCE_GROUP: 'NavaTron'
      AZURE_FRONT_DOOR_PROFILE: 'navatron'
      AZURE_FRONT_DOOR_ENDPOINT: 'caverace'
    steps:
      - name: Check for a newer main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: a newer commit is already on main.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download verified site
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: caverace-site
          path: public

      - name: Validate deployment configuration
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_STORAGE_ACCOUNT AZURE_FRONT_DOOR_RESOURCE_GROUP AZURE_FRONT_DOOR_PROFILE AZURE_FRONT_DOOR_ENDPOINT AZURE_FRONT_DOOR_DOMAINS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the repository Actions variable ${name} before deployment."
              exit 1
            fi
          done

      - name: Sign in to Azure with OpenID Connect
        if: steps.current.outputs.deploy == 'true'
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Upload website
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/404.html
          # Publish assets first so newly uploaded HTML can reference them.
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          for source in Path('public').rglob('*'):
              if source.is_file():
                  group = 'pages' if source.suffix == '.html' else 'assets'
                  target = Path(os.environ['RUNNER_TEMP']) / 'caverace-upload' / group / source.relative_to('public')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source, target)
          PY
          for group in assets pages; do
            az storage blob upload-batch \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --auth-mode login \
              --destination '$web' \
              --source "${RUNNER_TEMP}/caverace-upload/${group}" \
              --overwrite true \
              --content-cache-control 'public, max-age=300' \
              --only-show-errors \
              --output none
          done

      - name: Purge CaveRace cache
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          read -r -a domains <<< "$AZURE_FRONT_DOOR_DOMAINS"
          az afd endpoint purge \
            --resource-group "$AZURE_FRONT_DOOR_RESOURCE_GROUP" \
            --profile-name "$AZURE_FRONT_DOOR_PROFILE" \
            --endpoint-name "$AZURE_FRONT_DOOR_ENDPOINT" \
            --domains "${domains[@]}" \
            --content-paths '/*' \
            --no-wait \
            --only-show-errors

      - name: Verify deployed homepage
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Cache invalidation propagates asynchronously. Compare the served
          # homepage with this build, rather than accepting any HTTP 200.
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --compressed \
              --connect-timeout 10 --max-time 30 \
              https://caverace.com/ -o "${RUNNER_TEMP}/live-index.html" \
              && cmp --silent public/index.html "${RUNNER_TEMP}/live-index.html"; then
              echo "Deployed ${GITHUB_SHA} to https://caverace.com/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for the updated homepage (${attempt}/30)."
            sleep 20
          done
          echo '::error::The live homepage did not match the uploaded build within the verification window.'
          exit 1
